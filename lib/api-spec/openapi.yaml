            schema:
              $ref: "#/components/schemas/CreatePriceBookInput"
      responses:
        "201":
          description: Created price book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceBook"

  /price-books/{id}:
    get:
      operationId: getPriceBook
      tags: [price-books]
      summary: Get price book with entries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Price book with entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceBookDetail"
    put:
      operationId: updatePriceBook
      tags: [price-books]
      summary: Update price book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
