          type: integer
          nullable: true
        annualRevenue:
          type: number
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        stage:
          type: string
          nullable: true
        amount:
          type: number
          nullable: true
        closeDate:
          type: string
          nullable: true
        probability:
          type: integer
          nullable: true
        forecastCategory:
          type: string
          nullable: true
        nextStep:
          type: string
          nullable: true
        optyOwner:
          type: string
          nullable: true
        optyTeam:
          type: string
          nullable: true
        ownerId:
          type: integer
          nullable: true
        createdBy:
          type: integer
          nullable: true
        modifiedBy:
          type: integer
          nullable: true
        clmEnabled:
          type: boolean
        ownerName:
          type: string
          nullable: true
        contactCount:
          type: integer
        dealCount:
          type: integer
