kind = "web"
previewPath = "/"
title = "CRMAI"
version = "1.0.0"
id = "artifacts/crmai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25234

[services.development]
run = "pnpm --filter @workspace/crmai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crmai", "run", "build" ]
publicDir = "artifacts/crmai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25234"
BASE_PATH = "/"
