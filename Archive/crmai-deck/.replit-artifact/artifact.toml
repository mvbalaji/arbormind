kind = "slides"
previewPath = "/crmai-deck/"
title = "ArborMind CRM Overview"
version = "1.0.0"
id = "artifacts/crmai-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/crmai-deck/" ]
localPort = 19775

[services.development]
run = "pnpm --filter @workspace/crmai-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crmai-deck", "run", "build" ]
publicDir = "artifacts/crmai-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19775"
BASE_PATH = "/crmai-deck/"
