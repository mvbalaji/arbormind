packages:
  "recharts": "Powerful, composable charting library for dashboard and reports"
  "@hello-pangea/dnd": "Maintained fork of react-beautiful-dnd for Kanban board"
  "framer-motion": "For smooth page transitions and micro-interactions"
  "date-fns": "For formatting dates in tables and activity logs"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility to merge tailwind classes safely"

images:
  - path: "artifacts/crmai/public/images/ai-bg.png"
    description: "Dark, sleek, abstract glowing mesh background in electric blue and deep purple, high tech enterprise feel"
    aspect_ratio: "16:9"
  - path: "artifacts/crmai/public/images/login-hero.png"
    description: "Abstract geometric 3D shapes floating in dark space with subtle blue rim lighting, professional corporate"
    aspect_ratio: "16:9"

notes:
  - App relies heavily on @workspace/api-client-react hooks generated by Orval
  - The application is styled with a dark "enterprise" theme globally
